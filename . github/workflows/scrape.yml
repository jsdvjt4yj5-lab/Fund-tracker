name: Scrape fund prices

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours
  workflow_dispatch: {}       # allows manual trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python scrape_fund_prices.py --targets targets.csv --out data/funds.json

      - name: Commit updated data
        run: |
          git config user.name "fund-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/funds.json
          git diff --quiet --cached || git commit -m "Update fund prices $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
